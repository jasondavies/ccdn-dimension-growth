name = "ccdn_dimension_growth"
version = "0.1.0"
defaultTargets = ["CCDN", "CCDNPaper", "Axioms", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The main library: exactly what the six main theorems need (modules `CCDN.*` below `CCDN/`).
[[lean_lib]]
name = "CCDN"

# The paper library: Section 5, the paper's statements as printed and the counterexamples
# (modules `CCDNPaper.*` below `CCDNPaper/`). It imports `CCDN`; `CCDN` never imports it.
[[lean_lib]]
name = "CCDNPaper"

[[lean_lib]]
name = "Axioms"

# Vendored Bombieri–Vaaler development (see NOTICE and vendor/bombieri-vaaler/upstream.json),
# built as part of this package so that no build output is written below vendor/.
[[lean_lib]]
name = "ArithmeticHeights"
srcDir = "vendor/bombieri-vaaler"

# Adapted first Mertens theorem (see vendor/mertens/upstream.json), built as part of this
# package so that no build output is written below vendor/.
[[lean_lib]]
name = "Mertens"
srcDir = "vendor/mertens"

# The Challenge deliberately states its theorems with `sorry`.
[[lean_lib]]
name = "Challenge"
leanOptions = { warningAsError = false }

[[lean_lib]]
name = "Solution"
